name: CI                          # 1. workflow name in the Actions tab

on:                               # 2. when to run
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:                             # 3. list of jobs
  test:                           # 4. job id
    runs-on: ubuntu-latest        # 5. which machine
    steps:                        # 6. steps, in order
      - name: Get code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest
